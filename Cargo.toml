[workspace]
resolver = "2"
members = ["crates/baton-core", "crates/baton-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tyggy/baton"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Release builds made by cargo-dist (`dist build`).
[profile.dist]
inherits = "release"
lto = "thin"
