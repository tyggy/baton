# cargo-dist (https://opensource.axo.dev/cargo-dist/): `dist plan` to preview,
# `dist build --artifacts=local` to build here; CI (.github/workflows/release.yml,
# generated by `dist generate`) builds and publishes on a `v*` tag.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
# macOS only for now: the daemon drives tmux, launchd and Tailscale on a Mac.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# curl … | sh installer and a Homebrew formula, both attached to the GitHub Release.
installers = ["shell", "homebrew"]
# Formula is pushed to this tap on release (needs a HOMEBREW_TAP_TOKEN secret).
tap = "tyggy/homebrew-baton"
formula = "baton"
publish-jobs = ["homebrew"]
install-path = "CARGO_HOME"
install-updater = false
