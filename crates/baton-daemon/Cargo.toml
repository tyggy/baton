[package]
name = "baton-daemon"
description = "baton: daemon, TUI and setup for Baton"
homepage = "https://github.com/tyggy/baton"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "baton"
path = "src/main.rs"

[dependencies]
baton-core = { path = "../baton-core" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "process", "fs", "io-util"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
flate2 = "1"
serde.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
libc = "0.2"
# push.rs: HPKE (RFC 9180) to the device key, HTTPS to the relay
hpke = { version = "0.13", default-features = false, features = ["alloc", "x25519"] }
rand_core = { version = "0.9", features = ["os_rng"] }
sha2 = "0.10"
base64 = "0.22"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
# config.toml; `baton setup` / `baton pair` terminal QR
toml = "0.9"
qrcode = { version = "0.14", default-features = false }
